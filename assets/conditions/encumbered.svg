<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#4a2800" stroke="#c8860a" stroke-width="4"/>
  <!-- Weight bag body -->
  <ellipse cx="50" cy="62" rx="28" ry="24" fill="#c8860a"/>
  <!-- Weight bag neck -->
  <rect x="42" y="38" width="16" height="12" rx="4" fill="#c8860a"/>
  <!-- Weight bar on top -->
  <rect x="28" y="32" width="44" height="8" rx="4" fill="#e8a020"/>
  <!-- Hook/handle at top -->
  <rect x="46" y="22" width="8" height="12" rx="3" fill="#e8a020"/>
  <!-- Weight lines on bag -->
  <line x1="36" y1="54" x2="64" y2="54" stroke="#4a2800" stroke-width="3" stroke-linecap="round"/>
  <line x1="33" y1="64" x2="67" y2="64" stroke="#4a2800" stroke-width="3" stroke-linecap="round"/>
  <line x1="36" y1="74" x2="64" y2="74" stroke="#4a2800" stroke-width="3" stroke-linecap="round"/>
</svg>
